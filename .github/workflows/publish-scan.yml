name: Publish latest scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest-scan
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest scanner data
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            "https://web-production-3431ab.up.railway.app/scan?limit=5" \
            -o new_scan.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("new_scan.json")
          data = json.loads(p.read_text())
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Process v3.1 confirmation and deterioration
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python process_scan.py

      - name: Process v3.2 shadow engine
        run: python shadow_scan.py

      - name: Run v3.2 shadow tests
        run: python -m unittest discover -s tests -p "test_shadow_scan.py"

      - name: Commit scanner state
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"

          git add latest_scan.json
          [ -f scanner_state.json ] && git add scanner_state.json
          [ -f signal_events.jsonl ] && git add signal_events.jsonl
          [ -f shadow_state.json ] && git add shadow_state.json
          [ -f shadow_events.jsonl ] && git add shadow_events.jsonl

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update market scan and signal state"

          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi

            echo "git push failed (attempt $attempt/4); retrying..."
            sleep $((attempt * 5))
          done

          echo "git push failed after 4 attempts"
          exit 1
