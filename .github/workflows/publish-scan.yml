name: Publish latest scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [experimental_telegram.py, experimental_telegram_config.json, paper_learning_telegram.py, paper_learning_telegram_config.json, telegram_rewards.py, telegram_reward_config.json]
  
permissions:
  contents: write

concurrency:
  group: publish-latest-scan
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Queued runs must read the latest state, not the dispatch-time SHA.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Fetch latest scanner data
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            "https://web-production-3431ab.up.railway.app/scan?limit=5" \
            -o new_scan.json

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("new_scan.json")
          data = json.loads(p.read_text())
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Fetch v3.4 swing discovery
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --retry-delay 5 \
            "https://web-production-3431ab.up.railway.app/swing-discovery" \
            -o new_swing.json

          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("new_swing.json")
          data = json.loads(p.read_text())
          p.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY

      - name: Process v3.1 confirmation and deterioration (logging only)
        run: python process_scan.py

      - name: Process v3.2 shadow engine
        run: python shadow_scan.py

      - name: Process v3.4 swing shadow logger
        run: python swing_shadow.py

      - name: Measure V3.4 entry drift before Telegram
        run: python swing_entry_drift.py

      - name: Verify scanner and notification guards
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Send user-authorized experimental shorts to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python experimental_telegram.py

      - name: Log Dataset snapshot
        run: python dataset_logger.py

      - name: Rank swing setups internally
        run: python swing_ranker.py

      - name: Log swing rank history
        run: python swing_rank_history.py

      - name: Process 5pct swing outcomes
        run: python swing_outcomes.py

      - name: Update prospective paper learning
        timeout-minutes: 4
        run: python paper_learning.py

      - name: Score Telegram outcomes and update shadow reward learner
        run: python telegram_rewards.py

      - name: Notify user of new paper-learning observations
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 3
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_learning_telegram.py

      - name: Audit 5pct objective integrity
        run: python data_audit_v2.py

      - name: Run scanner tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Commit scanner state
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"

          [ -f experimental_telegram_state.json ] && git add experimental_telegram_state.json
          [ -d paper_learning ] && git add paper_learning
          git add latest_scan.json
          [ -f scanner_state.json ] && git add scanner_state.json
          [ -f signal_events.jsonl ] && git add signal_events.jsonl
          [ -f shadow_state.json ] && git add shadow_state.json
          [ -f shadow_events.jsonl ] && git add shadow_events.jsonl
          [ -f swing_state.json ] && git add swing_state.json
          [ -f swing_telegram_state.json ] && git add swing_telegram_state.json
          [ -f swing_telegram_filter_events.jsonl ] && git add swing_telegram_filter_events.jsonl
          [ -f swing_entry_drift_events.jsonl ] && git add swing_entry_drift_events.jsonl
          [ -f swing_events.jsonl ] && git add swing_events.jsonl
          [ -f swing_outcomes.json ] && git add swing_outcomes.json
          [ -f swing_outcome_events.jsonl ] && git add swing_outcome_events.jsonl
          [ -f swing_rankings.json ] && git add swing_rankings.json
          [ -f data_audit_report_v2.json ] && git add data_audit_report_v2.json
          [ -f swing_rank_history_state.json ] && git add swing_rank_history_state.json
          [ -d swing_rank_history ] && git add swing_rank_history
          [ -f dataset_v1_state.json ] && git add dataset_v1_state.json
          [ -d dataset_v1 ] && git add dataset_v1

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Update market scan and signal state"

          for attempt in 1 2 3 4; do
            # Another workflow or repo edit may have moved main while this scan
            # was running. Rebase our state commit onto the newest main before
            # each push attempt instead of retrying the same stale commit.
            if ! git pull --rebase origin main; then
              echo "rebase failed; aborting to avoid overwriting remote changes"
              git rebase --abort || true
              exit 1
            fi

            if git push origin main; then
              exit 0
            fi

            echo "git push raced with another writer (attempt $attempt/4); refreshing..."
            sleep $((attempt * 3))
          done

          echo "git push failed after 4 synchronized attempts"
          exit 1
