name: Development entry walk-forward v3
on:
  push:
    branches: [research/model-v2-60pct]
    paths: [research_entry_walkforward_v3.py, .github/workflows/entry-walkforward-v3.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3 scikit-learn==1.8.0 lightgbm==4.6.0
      - uses: actions/download-artifact@v4
        with:
          name: futures-ml-research-v2-36743301853
          run-id: 36743301853
          github-token: ${{ github.token }}
          path: _prior_research
      - run: python -m unittest discover -s research_tests -v
      - run: python -u research_entry_walkforward_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-entry-walkforward-v3
          path: _walkforward_v3/
          retention-days: 30
