name: Matched V3.4 vs R6 and losing-trade audit
on:
  push:
    branches: [research/model-v2-60pct]
    paths: [research_matched_audit_v7.py, .github/workflows/matched-audit-v7.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3 scikit-learn==1.8.0
      - uses: actions/download-artifact@v4
        with:
          name: futures-ml-research-v2-36743301853
          run-id: 36743301853
          github-token: ${{ github.token }}
          path: _prior_research
      - uses: actions/download-artifact@v4
        with:
          name: support-swing-v4-hourly-history
          run-id: 36759539407
          github-token: ${{ github.token }}
          path: _support_raw_v4
      - run: python -m unittest discover -s research_tests -v
      - run: python -u research_matched_audit_v7.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-audit-v7-research
          path: _matched_v7/
          retention-days: 30
